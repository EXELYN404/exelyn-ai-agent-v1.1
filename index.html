<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Animasi Tombol</title>
    <style>
        /* Gaya dasar tombol */
        .animated-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            /* Efek transisi halus */
            transition: transform 0.1s ease, background-color 0.2s;
        }

        /* Efek saat tombol diklik (Animasi menekan) */
        .animated-btn:active {
            transform: scale(0.90); /* Tombol sedikit menciut saat ditekan */
            background-color: #388E3C;
        }

        /* Kotak yang awalnya tersembunyi */
        .popup-box {
            margin-top: 20px;
            width: 200px;
            height: 100px;
            background-color: #ff9800;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            
            /* Status awal: Tersembunyi dan kecil */
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        /* Kelas yang akan ditambahkan via JavaScript untuk memunculkan animasi */
        .popup-box.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Tombol Interaktif -->
    <button class="animated-btn" id="myButton">Klik Saya!</button>

    <!-- Elemen yang akan muncul dengan animasi -->
    <div class="popup-box" id="popupBox">Halo, Animasi Muncul!</div>

    <script>
        // Mengambil elemen tombol dan kotak dari HTML
        const button = document.getElementById('myButton');
        const box = document.getElementById('popupBox');

        // Menjalankan fungsi saat tombol diklik
        button.addEventListener('click', function() {
            // Toggle (menambah/menghapus) kelas 'show' pada kotak
            box.classList.toggle('show');
        });
    </script>

</body>
</html>
